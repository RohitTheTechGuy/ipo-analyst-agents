# Golden set: OFS-heavy IPO (100% offer for sale, no fresh issue).
# Values use the RHP's own units (₹ million). page = 1-based PDF page index (PyMuPDF);
# printed_page = page number printed on the page. Quotes are verbatim page.get_text()
# with runs of whitespace collapsed to one space.
# ipo.* listing details (dates, band, lot) are NOT in the RHP (shown as [●]); they come
# from public sources and must be hand-checked against the price band advertisement.
needs_human_review: true
ipo:
  name: Hyundai Motor India Limited
  symbol: HYUNDAI
  category: ofs_heavy
  open_date: 2024-10-15
  close_date: 2024-10-17
  price_band: [1865, 1960]
  lot_size: 7
rhp:
  url: https://indiaipo.jpmorgan.com/content/dam/jpm/india-private-limited/documents/hyundai-motor-india-red-herring-prospectus.pdf
  source: J.P. Morgan India (BRLM) IPO site; RHP dated October 8, 2024
  sha256: 4403ba7da8373c0196175c885857132629b1e00583e21f53d656d62f38f988a2
  pages: 476
