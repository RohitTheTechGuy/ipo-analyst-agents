# Model IDs, prices (USD per 1M tokens), routing per task, budget and paths.
# A model used in `routing` without a price makes the run refuse to start.
# reasoning_effort is sent only where set (reasoning tokens bill as output and count against max_tokens).
models:
  luna:  { provider: openai, id: gpt-5.6-luna,        price_in: 0.20, price_cached: 0.02, price_out: 1.20, reasoning_effort: none }  # extraction needs no reasoning; at low it spent whole 4k budgets reasoning and returned nothing (HD Fire live run)
  terra: { provider: openai, id: gpt-5.6-terra,       price_in: 2.00, price_cached: 0.20, price_out: 12.00, reasoning_effort: low }
  groq:  { provider: groq,   id: openai/gpt-oss-120b, price_in: 0.0,  price_cached: 0.0,  price_out: 0.0 }
  sol:   { provider: openai, id: gpt-6.1-sol,         price_in: 2.00, price_cached: 0.10, price_out: 10.00, reasoning_effort: high }
  grok:  { provider: xai,    id: grok-4.20-0309-reasoning, price_in: 1.25, price_cached: 0.20, price_out: 2.50 }  # xAI; reasons by default, takes no reasoning_effort. grok-4.7 judged the same but took 129s (over the 120s timeout) vs 46s

routing:
  map_extract:          luna
  offer_objects:        terra
  financials:           terra
  offer_price_basis:    terra  # short section, dense tables (WACA, peer table); not in the plan's list
  fine_print_legal:     terra
  peer_valuation:       sol    # reasons about how the business is valued and defines business-specific multiples
  peer_fit:             terra  # is each peer a real peer, and what it shares with the IPO
  synthesizer:          terra
  risk_factors:         luna
  business_industry:    luna
  sentiment_agent:      luna
  promoters_governance: luna  # real prompts exceed Groq's 6k call limit (HD Fire live run)
  other_disclosures:    luna  # same
  verifier:             groq   # no call uses this task: verification is pure Python (verifier.py)
  sentiment_stance_tag: groq
  advisor:              sol
  summary_editor:       terra  # the Telegram summary in plain English, revised once on the judge's feedback (advisor ledger)
  demand_check:         grok   # the market disagreeing with the call, or closing day: the market as devil's advocate, re-testing the advisor's call and each reason (advisor ledger); another company's model from the advisor's
  summary_judge:        grok   # evaluates each plain draft before it is sent (advisor ledger); another company's model from the editor's, so it never grades its own family's writing

budget:
  cap_usd: 4.00  # analysis ledger; with the advisor's $1.00, $5.00 per IPO in all
  degrade_pct: 70
  # Pre-run estimate: pages x (tokens_per_page in + output_tokens_per_page out) at Luna prices + fixed_usd.
  # Over degrade_pct of the cap => the run starts degraded.
  #   in:  ~1,300 tokens of page text + ~300 per page of per-call overhead (each ~24k-char map call also
  #        sends ~1,500-2,200 tokens of prompt + schema, over ~6 pages)                  = 1,600/page
  #   out: ~170 visible + ~180 reasoning tokens (effort low; billed as output)          =   350/page
  #   per page: 1,600 x $0.20/1M + 350 x $1.20/1M = $0.00032 + $0.00042            = $0.00074
  #   fixed: Terra reduce/final calls (offer, financials at 8k out, fine print, price basis), peer
  #          valuation, synthesizer, plus reasoning on them, plus Luna reduce/sentiment = $0.55
  #   520-page RHP: 520 x $0.00074 = $0.385 + $0.55 = $0.93 (starts degraded above ~675 pages)
  estimate: { tokens_per_page: 1600, output_tokens_per_page: 350, fixed_usd: 0.55 }
  # Held back for the synthesizer: verifier re-asks stop once spent + in flight > cap - synth_reserve_usd,
  # leaving the remaining fields "could not verify". One Terra synthesizer call is ~$0.07-0.10.
  synth_reserve_usd: 0.40

# The Financial Advisor (ticket 27): BUY / NO BUY from the verified report, on its own ledger per IPO
# ("<ipo_id>:advisor"), on top of the analysis cap above, so the worst case is $4.00 + $1.00 = $5.00 per IPO.
# The plain-English summary editor (Terra, ~$0.03) is billed to this ledger too.
#   worst case reserved per advisor call: prompt (~25k tokens x $2/1M = $0.05) + 12,000 out x $10/1M ($0.12) = $0.17
#   analysis day + closing-day refresh: 2 x $0.17 = $0.34, plus the refresh's stance tags (Groq $0; on the
#   Luna fallback ~8 x $0.002 + ~$0.002 for the bull/bear points = ~$0.02) = ~$0.36, under the $0.50 cap.
# Measured per IPO (HD Fire, Fusion CX): advisor $0.09 + summary ~$0.03 + closing day ~$0.15 = ~$0.28.
advisor:
  cap_usd: 1.00  # advisor ledger: analysis day + closing-day refresh
  max_tokens: 24000  # reasoning (effort high, billed as output) + the answer
  closing_day_refresh: true  # on close day: re-gather sentiment and re-advise before the last update
  # Then the demand check (grok) on the same ledger: worst case ~25k in x $1.25/1M + 8,000 out x $2.50/1M
  # = ~$0.05 reserved; measured ~$0.045 a call (reasoning billed on top), so the refresh stays ~$0.41 of $1.00.
  demand_hot_total_x: 10    # hot demand: total subscription at or above this...
  demand_hot_retail_x: 5    # ...or retail at or above this
  demand_weak_x: 1          # weak demand: total or retail below this (undersubscribed)
  # Devil's advocate when the market disagrees with the call: a NO BUY with total >= devil_total_x, retail
  # above devil_retail_x (when published) and GMP >= devil_gmp_pct of the upper band; or a BUY with total
  # under devil_total_x and GMP under devil_gmp_pct.
  devil_total_x: 2
  devil_retail_x: 1
  devil_gmp_pct: 10
  demand_check_max_tokens: 8000

# Telegram questions on an analysed RHP (rhp_qa.py): the Claude Code CLI on this Mac, logged in with the
# Claude subscription, so $0 here (it counts against the plan's usage limits). Never an API key.
qa:
  model: sonnet        # Claude Code model alias
  timeout_s: 300       # per answer (web answers take longer)
  max_words: 150
  window_s: 600        # after an answer, the picks job keeps listening this long so follow-ups come back in seconds

groq_limits:
  max_call_tokens: 6000
  daily_budget_pct: 80
  daily_cap_tokens: 200000

default_max_tokens: 16000  # a section's own calls (single read, merge, re-ask): real merges ran past 4,000, and Terra reasons on top (HD Fire live run)
map_max_tokens: 12000  # part extraction on Luna; dense parts were cut off at 4,000 (HD Fire live run)
db_path: data/ipo.db
work_dir: data/work
reports_dir: reports  # every report + the Telegram text sent, per IPO (gitignored)

sentiment:
  # Domains whose IPO coverage is paid promotion; their articles never count in the stance tally.
  denylist_domains: []

peers:
  # RHP peer name -> NSE symbol, where NSE's search finds the wrong company. Matching ignores case,
  # punctuation and "Limited"/"Ltd".
  symbol_overrides:
    # The FY2024 Tata Motors that RHPs list (PV + JLR) trades as TMPV since the 2025 demerger; NSE's
    # search now gives the name "Tata Motors Limited" to the commercial-vehicles company (TMCV).
    Tata Motors Limited: TMPV
    # NSE's search finds neither by its full name (HD Fire RHP, Oct 2026).
    Elgi Equipment Limited: ELGIEQUIP
    Ingersoll-Rand (India) Limited: INGERRAND
