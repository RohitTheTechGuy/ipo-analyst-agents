# Model IDs, prices (USD per 1M tokens), routing per task, budget and paths.
# A model used in `routing` without a price makes the run refuse to start.
# reasoning_effort is sent only where set (reasoning tokens bill as output and count against max_tokens).
models:
  luna:  { provider: openai, id: gpt-5.6-luna,        price_in: 0.20, price_cached: 0.02, price_out: 1.20, reasoning_effort: low }
  terra: { provider: openai, id: gpt-5.6-terra,       price_in: 2.00, price_cached: 0.20, price_out: 12.00, reasoning_effort: low }
  groq:  { provider: groq,   id: openai/gpt-oss-120b, price_in: 0.0,  price_cached: 0.0,  price_out: 0.0 }
  sol:   { provider: openai, id: gpt-6.1-sol,         price_in: 2.00, price_cached: 0.10, price_out: 10.00, reasoning_effort: high }

routing:
  map_extract:          luna
  offer_objects:        terra
  financials:           terra
  offer_price_basis:    terra  # short section, dense tables (WACA, peer table); not in the plan's list
  fine_print_legal:     terra
  peer_valuation:       terra
  synthesizer:          terra
  risk_factors:         luna
  business_industry:    luna
  sentiment_agent:      luna
  promoters_governance: groq
  other_disclosures:    groq
  verifier:             groq
  sentiment_stance_tag: groq
  advisor:              sol

budget:
  cap_usd: 1.50
  degrade_pct: 70
  # Pre-run estimate: pages x (tokens_per_page in + output_tokens_per_page out) at Luna prices + fixed_usd.
  # Over degrade_pct of the cap => the run starts degraded.
  #   in:  ~1,300 tokens of page text + ~300 per page of per-call overhead (each ~24k-char map call also
  #        sends ~1,500-2,200 tokens of prompt + schema, over ~6 pages)                  = 1,600/page
  #   out: ~170 visible + ~180 reasoning tokens (effort low; billed as output)          =   350/page
  #   per page: 1,600 x $0.20/1M + 350 x $1.20/1M = $0.00032 + $0.00042            = $0.00074
  #   fixed: Terra reduce/final calls (offer, financials at 8k out, fine print, price basis), peer
  #          valuation, synthesizer, plus reasoning on them, plus Luna reduce/sentiment = $0.55
  #   520-page RHP: 520 x $0.00074 = $0.385 + $0.55 = $0.93 (starts degraded above ~675 pages)
  estimate: { tokens_per_page: 1600, output_tokens_per_page: 350, fixed_usd: 0.55 }
  # Held back for the synthesizer: verifier re-asks stop once spent + in flight > cap - synth_reserve_usd,
  # leaving the remaining fields "could not verify". One Terra synthesizer call is ~$0.07-0.10.
  synth_reserve_usd: 0.15

# The Financial Advisor (ticket 27): BUY / NO BUY from the verified report, on its own ledger per IPO
# ("<ipo_id>:advisor"), on top of the analysis cap above, so the worst case is $1.50 + $0.50 = $2.00 per IPO.
#   worst case reserved per advisor call: prompt (~25k tokens x $2/1M = $0.05) + 12,000 out x $10/1M ($0.12) = $0.17
#   analysis day + closing-day refresh: 2 x $0.17 = $0.34, plus the refresh's stance tags (Groq $0; on the
#   Luna fallback ~8 x $0.002 + ~$0.002 for the bull/bear points = ~$0.02) = ~$0.36, under the $0.50 cap.
advisor:
  cap_usd: 0.50
  max_tokens: 12000  # reasoning (effort high, billed as output) + the answer
  closing_day_refresh: true  # on close day: re-gather sentiment and re-advise before the last update

groq_limits:
  max_call_tokens: 6000
  daily_budget_pct: 80
  daily_cap_tokens: 200000

default_max_tokens: 4000
db_path: data/ipo.db
work_dir: data/work

sentiment:
  # Domains whose IPO coverage is paid promotion; their articles never count in the stance tally.
  denylist_domains: []

peers:
  # RHP peer name -> NSE symbol, where NSE's search finds the wrong company. Matching ignores case,
  # punctuation and "Limited"/"Ltd".
  symbol_overrides:
    # The FY2024 Tata Motors that RHPs list (PV + JLR) trades as TMPV since the 2025 demerger; NSE's
    # search now gives the name "Tata Motors Limited" to the commercial-vehicles company (TMCV).
    Tata Motors Limited: TMPV
